# ===========================================================================
# Conda environment for the MEDRF / mHC / RAG-LLM framework (main project).
#
# NOTE: This file is a hand-written *minimal template*. It was NOT produced by
# `conda env export` (conda was unavailable in the authoring environment).
# To capture your exact, reproducible environment, regenerate it on your own
# machine and strip the machine-specific `prefix:` line:
#
#     conda env export --no-builds | grep -v '^prefix:' > environment.yml
#
# For the separate MRI feature-extraction environment, see
# docs/MRI_EXTRACTION.md and environment-mri.yml (also user-generated).
# ===========================================================================
name: medrf
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - -r requirements.txt
# (No `prefix:` line — do not add a machine-specific absolute path here.)
